name: Live onboarding test

# Paid API calls are opt-in only; never run from pushes or pull requests.
on:
  workflow_dispatch:
    inputs:
      customer:
        description: Fictional example customer (uses API credits)
        required: true
        default: a
        type: choice
        options: [a, b, c]

permissions:
  contents: read

concurrency:
  group: live-onboarding
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicitly configured GitHub secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add the OPENAI_API_KEY repository secret before running a live test. Never commit .env."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install core dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run fresh API-backed onboarding
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          CUSTOMER: ${{ inputs.customer }}
        run: |
          case "$CUSTOMER" in
            a) SOURCE_LABEL="Customer A" ;;
            b) SOURCE_LABEL="Customer B" ;;
            c) SOURCE_LABEL="Customer C" ;;
            *) echo "::error::Unsupported example customer"; exit 1 ;;
          esac
          python onboarding_agent.py \
            --source-system "$SOURCE_LABEL" \
            --input-dir data/examples/week1 \
            --schema schemas/unified-schema.json \
            --output-dir outputs/live-run
      - name: Verify artifacts, key fields, dates, statuses and amounts
        env:
          CUSTOMER: ${{ inputs.customer }}
        run: |
          python scripts/check_end_to_end.py \
            --customer "$CUSTOMER" \
            --run-dir outputs/live-run \
            --output outputs/live-checks.json
      - name: Save fictional-data run evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-onboarding-${{ inputs.customer }}
          path: |
            outputs/live-run/
            outputs/live-checks.json
          if-no-files-found: warn
          retention-days: 7
