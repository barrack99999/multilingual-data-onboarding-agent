name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install core dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check publishable files
        run: python scripts/check_repository.py
      - name: Run offline tests and profiler checks
        run: python scripts/run_tests.py
      - name: Run the portable offline example
        run: |
          python onboarding_agent.py \
            --source-system "Customer A" \
            --input-dir data/examples/week1 \
            --analysis examples/field-analysis/customer_a.json \
            --mapping-dir examples/mappings \
            --output-dir outputs/ci-offline
